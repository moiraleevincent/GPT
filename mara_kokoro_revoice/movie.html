 const flutter=Math.sin(sec*8)*8;el('capecloth').setAttribute('d',`M260 167 Q${310+flutter} 130 ${376+flutter*2} 185 Q${348+flutter} 273 ${405+flutter} 408 Q331 371 ${297+flutter*2} 420 Q311 333 258 283Z`);

 const lidMove=sm(21.3,23.1,sec);let lx=-50*lidMove,ly=-135*lidMove-30*Math.sin(Math.PI*lidMove),lr= -75*lidMove;
