<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Tiny 3D Thing</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 30% 20%, #38245d 0, transparent 38%),
        radial-gradient(circle at 75% 75%, #12344c 0, transparent 40%),
        linear-gradient(145deg, #090b12, #121522 55%, #080a10);
      color: white;
      touch-action: none;
      user-select: none;
    }

    .hint {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(14px);
      font-size: 13px;
      letter-spacing: .02em;
      opacity: .8;
      white-space: nowrap;
    }

    .scene {
      width: 230px;
      height: 230px;
      perspective: 850px;
      display: grid;
      place-items: center;
    }

    .cube {
      position: relative;
      width: 130px;
      height: 130px;
      transform-style: preserve-3d;
      transform: rotateX(-22deg) rotateY(32deg);
      transition: transform .12s ease-out;
      filter: drop-shadow(0 35px 25px rgba(0,0,0,.35));
    }

    .face {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.04)),
        rgba(124, 94, 255, .32);
      box-shadow: inset 0 0 35px rgba(255,255,255,.08);
      backdrop-filter: blur(5px);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), background .45s ease;
    }

    .front  { transform: translateZ(65px); }
    .back   { transform: rotateY(180deg) translateZ(65px); }
    .right  { transform: rotateY(90deg) translateZ(65px); }
    .left   { transform: rotateY(-90deg) translateZ(65px); }
    .top    { transform: rotateX(90deg) translateZ(65px); }
    .bottom { transform: rotateX(-90deg) translateZ(65px); }

    .cube.pop .front  { transform: translateZ(92px); }
    .cube.pop .back   { transform: rotateY(180deg) translateZ(92px); }
    .cube.pop .right  { transform: rotateY(90deg) translateZ(92px); }
    .cube.pop .left   { transform: rotateY(-90deg) translateZ(92px); }
    .cube.pop .top    { transform: rotateX(90deg) translateZ(92px); }
    .cube.pop .bottom { transform: rotateX(-90deg) translateZ(92px); }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      position: absolute;
      left: 54px;
      top: 54px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 0 28px rgba(255,255,255,.75);
      transform: translateZ(66px);
      pointer-events: none;
    }

    .floor {
      position: fixed;
      width: 240px;
      height: 65px;
      border-radius: 50%;
      background: rgba(0,0,0,.34);
      filter: blur(18px);
      transform: translateY(120px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hint">drag me · tap me</div>
  <div class="floor"></div>
  <div class="scene">
    <div class="cube" id="cube" aria-label="Interactive 3D cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    const cube = document.getElementById('cube');
    const faces = [...document.querySelectorAll('.face')];
    let rx = -22, ry = 32;
    let dragging = false, moved = false;
    let px = 0, py = 0;
    let hue = 255;

    function draw() {
      cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }

    addEventListener('pointerdown', e => {
      dragging = true;
      moved = false;
      px = e.clientX;
      py = e.clientY;
    });

    addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - px;
      const dy = e.clientY - py;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      ry += dx * .55;
      rx -= dy * .55;
      px = e.clientX;
      py = e.clientY;
      draw();
    });

    addEventListener('pointerup', () => {
      if (!dragging) return;
      dragging = false;
      if (!moved) {
        cube.classList.toggle('pop');
        hue = (hue + 67) % 360;
        faces.forEach((face, i) => {
          face.style.background = `linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,.04)), hsla(${(hue + i*12)%360}, 80%, 62%, .34)`;
        });
      }
    });

    // Gentle idle motion until you grab it.
    let t = 0;
    function idle() {
      if (!dragging) {
        t += .008;
        ry += .08;
        cube.style.transform = `rotateX(${rx + Math.sin(t) * 3}deg) rotateY(${ry}deg)`;
      }
      requestAnimationFrame(idle);
    }
    idle();
  </script>
</body>
</html>
