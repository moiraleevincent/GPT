<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('ocean'),g=c.getContext('2d',{alpha:false}),TAU=Math.PI*2;
let w=0,h=0,dpr=1,t=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,mode='study',pace=.65,brightness=1,deadline=0,idleTimer,toastTimer,wakeLock=null;
const rand=n=>{const a=Math.sin(n*127.1+311.7)*43758.5453;return a-Math.floor(a)},mix=(a,b,s)=>a+(b-a)*s;
const motes=Array.from({length:85},(_,i)=>({x:rand(i+12),y:rand(i+100),z:rand(i+201)}));
const plants=Array.from({length:44},(_,i)=>({x:i<24?rand(i+2)*.27:.78+rand(i+2)*.25,len:.17+rand(i+92)*.45,width:5+rand(i+63)*15,phase:rand(i+55)*TAU,depth:rand(i+76)})).sort((a,b)=>a.depth-b.depth);
const stones=Array.from({length:34},(_,i)=>({x:rand(i+460),y:.87+rand(i+700)*.15,r:16+rand(i+500)*62,z:rand(i+1000)})).sort((a,b)=>a.y-b.y);
const fish=Array.from({length:28},(_,i)=>({x:rand(i+222),y:.25+rand(i+14)*.48,z:rand(i+61),dir:i%3?-1:1,phase:rand(i+2)*TAU,group:i%3}));
const jelly=[{x:.38,y:.34,s:1,hue:177,p:1},{x:.70,y:.50,s:.76,hue:266,p:4},{x:.61,y:.19,s:.40,hue:190,p:7},{x:.19,y:.56,s:.35,hue:185,p:10},{x:.83,y:.27,s:.31,hue:207,p:13}];
let backdrop=document.createElement('canvas'),bg=backdrop.getContext('2d'),pointer={x:0,y:0},visitor=null,visitorUntil=0;
function viewX(x,depth=1){return x+pointer.x*depth*16+Math.sin(t*.018)*depth*5}

function rays(){g.save();g.globalCompositeOperation='screen';for(let i=0;i<6;i++){let x=w*(.16+i*.145)+Math.sin(t*.035+i)*w*.018,spread=w*(.06+rand(i+5)*.08);let grad=g.createLinearGradient(x,0,x+h*.2,h*.88);grad.addColorStop(0,'#92e5d507');grad.addColorStop(.5,'#7abbb704');grad.addColorStop(1,'#65c6bc00');g.fillStyle=grad;g.beginPath();g.moveTo(x,0);g.lineTo(x+w*.024,0);g.lineTo(x+spread+h*.22,h);g.lineTo(x-spread*.25+h*.22,h);g.closePath();g.fill()}g.restore()}
function plant(p,front){let unit=Math.min(w/900,h/700),len=h*p.len*(front?1:.80),x=viewX(p.x*w,p.depth),y=viewY(h*(front?1.035:.91),p.depth),bend=Math.sin(t*.28+p.phase)*len*.09+len*.13,wide=p.width*Math.max(.6,unit)*(front?1:.75);g.save();g.translate(x,y);let grad=g.createLinearGradient(0,0,bend,-len);grad.addColorStop(0,front?'#03151c':'#0b2d38');grad.addColorStop(.55,front?'#10433e':'#10444b');grad.addColorStop(1,front?'#327564':'#1b5960');g.fillStyle=grad;g.beginPath();g.moveTo(-wide*.25,0);g.bezierCurveTo(-wide*1.4,-len*.33,bend+wide*1.2,-len*.75,bend,-len);g.bezierCurveTo(bend+wide*.1,-len*.72,wide*1.6,-len*.32,wide*.25,0);g.fill();g.strokeStyle=front?'#55937d24':'#74b9b516';g.lineWidth=.8;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(wide*.4,-len*.35,bend+wide*.4,-len*.7,bend,-len);g.stroke();g.restore()}
function rock(s){let unit=Math.max(.55,Math.min(w/1000,h/700)),rx=s.r*unit,ry=rx*(.38+s.z*.35),x=viewX(s.x*w,s.z),y=viewY(s.y*h,s.z);let grad=g.createLinearGradient(0,-ry,0,ry);grad.addColorStop(0,s.z>.5?'#29464a':'#1c3944');grad.addColorStop(.3,'#142d37');grad.addColorStop(1,'#040e19');g.save();g.translate(x,y);g.rotate((s.z-.5)*.3);ellipse(0,0,rx,ry,grad);g.strokeStyle='#9ec3b00b';g.lineWidth=1;g.beginPath();g.ellipse(0,-ry*.04,rx*.9,ry*.84,0,3.6,5.7);g.stroke();g.restore()}
function swimmer(f,i){let speed=.006+f.z*.008;let x=viewX(((((f.x+t*speed*f.dir)%1.24)+1.24)%1.24-.12)*w,f.z),y=viewY(h*(f.y+Math.sin(t*.12+f.phase)*.023),f.z);let size=(10+f.z*16)*Math.max(.8,Math.min(w/900,h/700)),tail=Math.sin(t*2.7+f.phase)*.23;g.save();g.translate(x,y);g.scale(f.dir,1);g.globalAlpha=.48+f.z*.48;let hue=f.group===0?32:f.group===1?176:205;let grad=g.createLinearGradient(-size,-size*.5,size,size*.5);grad.addColorStop(0,`hsla(${hue},35%,65%,.7)`);grad.addColorStop(.4,`hsla(${hue},40%,70%,.9)`);grad.addColorStop(1,`hsla(${hue+15},40%,27%,.8)`);g.fillStyle=`hsla(${hue},40%,63%,.4)`;g.beginPath();g.moveTo(-size*.65,0);g.lineTo(-size*1.45,-size*(.47+tail));g.quadraticCurveTo(-size*1.25,0,-size*1.45,size*(.47-tail));g.closePath();g.fill();g.beginPath();g.moveTo(size,0);g.bezierCurveTo(size*.2,-size*.62,-size*.5,-size*.45,-size*.8,0);g.bezierCurveTo(-size*.4,size*.38,size*.25,size*.48,size,0);g.fillStyle=grad;g.fill();g.fillStyle=`hsla(${hue},45%,70%,.22)`;g.beginPath();g.moveTo(0,-size*.25);g.lineTo(-size*.35,-size*.75);g.lineTo(-size*.6,-size*.2);g.fill();ellipse(size*.65,-size*.06,size*.07,size*.07,'#09232c');ellipse(size*.67,-size*.085,size*.019,size*.019,'#c5e4db');g.restore()}
function medusa(j){let scale=Math.max(.62,Math.min(w/1050,h/760)),r=59*j.s*scale;let x=w*(j.x+Math.sin(t*.045+j.p)*.035),y=viewY(h*(j.y+Math.sin(t*.075+j.p)*.035),.48);let pulse=Math.sin(t*1.15+j.p),sx=1+pulse*.065,sy=1-pulse*.11;g.save();g.translate(x,y);g.rotate(Math.sin(t*.09+j.p)*.10);let halo=g.createRadialGradient(0,0,0,0,0,r*2.2);halo.addColorStop(0,`hsla(${j.hue},75%,65%,.08)`);halo.addColorStop(1,`hsla(${j.hue},75%,65%,0)`);g.fillStyle=halo;g.fillRect(-r*2.2,-r*2.2,r*4.4,r*4.4);

for(let k=0;k<13;k++){let root=(k/12-.5)*r*1.65*sx,length=r*(1.25+rand(k+j.p*19)*1.5);g.beginPath();for(let q=0;q<=24;q++){let v=q/24,xx=root+Math.sin(t*.68-v*4.4+k*.6+j.p)*r*.14*v+Math.sin(v*6+t*.3)*r*.14*v,yy=r*.12+v*length;if(q===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.lineWidth=scale*(k%3===0?1.1:.6);g.strokeStyle=`hsla(${j.hue},65%,77%,${.18+(k%3)*.06})`;g.stroke()}
for(let k=0;k<4;k++){g.beginPath();for(let q=0;q<=28;q++){let v=q/28,xx=(k-1.5)*r*.24+Math.sin(v*10-t*.8+k)*r*.12*v,yy=r*.12+v*r*1.65;if(q===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.lineWidth=r*.075;g.strokeStyle=`hsla(${j.hue},55%,72%,.13)`;g.stroke();g.lineWidth=r*.018;g.strokeStyle=`hsla(${j.hue},65%,86%,.25)`;g.stroke()}
g.scale(sx,sy);let bell=g.createRadialGradient(-r*.25,-r*.35,r*.02,0,-r*.1,r);bell.addColorStop(0,`hsla(${j.hue},55%,86%,.34)`);bell.addColorStop(.5,`hsla(${j.hue},55%,68%,.14)`);bell.addColorStop(.86,`hsla(${j.hue},65%,75%,.24)`);bell.addColorStop(1,`hsla(${j.hue},70%,85%,.51)`);g.beginPath();g.moveTo(-r,r*.12);g.bezierCurveTo(-r*.95,-r*.92,r*.86,-r*.96,r,r*.12);g.bezierCurveTo(r*.55,r*.34,-r*.55,r*.34,-r,r*.12);g.fillStyle=bell;g.fill();g.strokeStyle=`hsla(${j.hue},65%,85%,.45)`;g.lineWidth=.9;g.stroke();for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(0,-r*.54);g.bezierCurveTo(k*r*.20,-r*.4,k*r*.32,-r*.02,k*r*.36,r*.19);g.strokeStyle=`hsla(${j.hue},70%,88%,.13)`;g.stroke()}g.beginPath();for(let k=0;k<=36;k++){let xx=(k/36*2-1)*r,yy=r*(.13+.09*Math.sin(k/36*Math.PI)) + Math.sin(k*1.8)*r*.018;if(k===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.lineWidth=1.8;g.strokeStyle=`hsla(${j.hue},65%,84%,.50)`;g.stroke();for(let k=0;k<4;k++){let a=k*TAU/4+t*.04;ellipse(Math.cos(a)*r*.16,-r*.1+Math.sin(a)*r*.105,r*.12,r*.07,null,`hsla(${j.hue},60%,86%,.25)`)}g.restore()}
function anemones(){for(let i=0;i<9;i++){let x=viewX(w*(.06+i*.11+rand(i+90)*.04),.8),y=h*(.91+rand(i+33)*.035),u=Math.max(.7,Math.min(w/900,h/700));g.save();g.translate(x,y);for(let k=0;k<11;k++){let a=(k-5)*.11,L=(12+rand(i*20+k)*20)*u;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(a*20*u+Math.sin(t*.4+k)*3*u,-L*.6,a*35*u+Math.sin(t*.4+k)*5*u,-L);g.lineWidth=(1.4+rand(k+2))*u;g.strokeStyle=i%2?'#8f8fb17c':'#77bca993';g.lineCap='round';g.stroke();ellipse(a*35*u+Math.sin(t*.4+k)*5*u,-L,1.5*u,1.5*u,'#b6e7d2a0')}g.restore()}}

function drawVisitor(){let x=viewX(visitor.x*w,.85),y=viewY(visitor.y*h,.85)+Math.sin(t*.7)*4,u=Math.max(.65,Math.min(w/900,h/700));g.save();g.translate(x,y);g.globalAlpha=Math.min(1,(visitorUntil-Date.now())/900);g.shadowColor="#a9e4d7";g.shadowBlur=16*u;g.strokeStyle="#b2d8c5";g.fillStyle="#8fbd9e";g.lineWidth=1.6*u;g.beginPath();g.moveTo(0,10*u);g.bezierCurveTo(-9*u,6*u,-8*u,-3*u,-2*u,-6*u);g.bezierCurveTo(-3*u,-14*u,6*u,-16*u,9*u,-11*u);g.bezierCurveTo(12*u,-7*u,7*u,-2*u,3*u,-4*u);g.bezierCurveTo(12*u,-2*u,11*u,7*u,4*u,10*u);g.bezierCurveTo(3*u,14*u,12*u,13*u,9*u,18*u);g.bezierCurveTo(7*u,21*u,1*u,17*u,4*u,14*u);g.lineTo(-1*u,12*u);g.closePath();g.fill();g.stroke();g.shadowBlur=0;g.fillStyle="#e3f0cf";g.beginPath();g.arc(3*u,-10*u,1.15*u,0,TAU);g.fill();g.strokeStyle="#b2d8c5";g.beginPath();g.moveTo(-2*u,-5*u);g.lineTo(-7*u,-9*u);g.moveTo(-1*u,1*u);g.lineTo(-8*u,4*u);g.stroke();g.restore()}
function frame(now){let dt=last?Math.min((now-last)/1000,.08):0;last=now;if(!paused&&!document.hidden){t+=dt*pace*(mode==='sleep'?.57:1);render()}if(deadline){let left=deadline-Date.now();$('shade').style.opacity=String(Math.max(1-brightness,1-Math.max(0,Math.min(1,left/60000))));if(left<=0){deadline=0;paused=true;pauseUI();$('timer').value='0'}}requestAnimationFrame(frame)}
function save(){try{localStorage.setItem('moongarden-v1',JSON.stringify({mode,pace,brightness}))}catch{}}
function setBrightness(){brightness=Number($('brightness').value)/100;$('shade').style.opacity=String(1-brightness);save()}
function selectMode(next){mode=next;$('study').setAttribute('aria-pressed',String(mode==='study'));$('sleep').setAttribute('aria-pressed',String(mode==='sleep'));brightness=mode==='sleep'?.48:1;$('brightness').value=String(brightness*100);setBrightness();save()}
function showControls(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if($('settings').hidden&&!$('dock').contains(document.activeElement))document.body.classList.add('idle')},4800)}
function notify(message){$('notice').textContent=message;$('notice').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('notice').classList.remove('show'),8500)}
function pauseUI(){$('pause').setAttribute('aria-label',paused?'Resume animation':'Pause animation');$('pause').setAttribute('aria-pressed',String(paused));$('pause').innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>'}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else if(document.documentElement.webkitRequestFullscreen){document.documentElement.webkitRequestFullscreen()}else{notify('For fullscreen on iPhone: open in Safari, tap Share, then Add to Home Screen. Open Moongarden from its new icon.')}}catch{notify('Fullscreen is unavailable in this browser. Open in Safari and use Share → Add to Home Screen.')}}
async function acquireWake(){if(!$('awake').checked||document.hidden)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch{$('awake').checked=false;notify('This browser could not keep the screen awake. Your device’s normal screen timeout will apply.')}}
$('study').onclick=()=>selectMode('study');$('sleep').onclick=()=>selectMode('sleep');$('pause').onclick=()=>{paused=!paused;pauseUI();if(!paused){deadline=0;$('timer').value='0';setBrightness()}};$('fullscreen').onclick=fullscreen;
function panel(open){$('settings').hidden=!open;$('options').setAttribute('aria-expanded',String(open));showControls()}
$('options').onclick=()=>panel($('settings').hidden);$('close').onclick=()=>{panel(false);$('options').focus()};$('brightness').oninput=setBrightness;$('speed').oninput=()=>{pace=Number($('speed').value)/100;save()};$('timer').onchange=()=>{const minutes=Number($('timer').value);deadline=minutes?Date.now()+minutes*60000:0;setBrightness();if(minutes){paused=false;pauseUI();notify(`The aquarium will fade to black in ${minutes} minutes.`)}};$('awake').onchange=async()=>{if($('awake').checked){if('wakeLock'in navigator)await acquireWake();else{$('awake').checked=false;notify('Keep-awake is unavailable in this browser.')}}else if(wakeLock){await wakeLock.release();wakeLock=null}};
document.addEventListener('visibilitychange',()=>{last=0;if(!document.hidden)acquireWake()});document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen');showControls()});document.addEventListener('pointermove',showControls,{passive:true});document.addEventListener('pointerdown',showControls,{passive:true});document.addEventListener('keydown',e=>{showControls();if(e.target.matches('input,select,button'))return;if(e.code==='Space'){e.preventDefault();$('pause').click()}if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape')panel(false)});$('dock').addEventListener('pointerup',e=>{const button=e.target.closest('button');if(button)setTimeout(()=>button.blur(),0)});window.addEventListener('resize',resize,{passive:true});window.addEventListener('pointermove',e=>{pointer.x=(e.clientX/w-.5)*2;pointer.y=(e.clientY/h-.5)*2},{passive:true});window.addEventListener('pointerdown',e=>{if(e.target.closest('#dock,#settings'))return;pointer.x=(e.clientX/w-.5)*2;pointer.y=(e.clientY/h-.5)*2;if(e.clientY>h*.56){visitor={x:e.clientX/w,y:.75+Math.random()*.08};visitorUntil=Date.now()+5200;if(paused)render()}showControls()},{passive:true});
try{const s=JSON.parse(localStorage.getItem('moongarden-v1')||'null');if(s){selectMode(s.mode==='sleep'?'sleep':'study');pace=Number.isFinite(s.pace)?Math.max(.15,Math.min(1,s.pace)):.65;brightness=Number.isFinite(s.brightness)?Math.max(.15,Math.min(1,s.brightness)):1;$('speed').value=String(pace*100);$('brightness').value=String(brightness*100);setBrightness()}}catch{}
