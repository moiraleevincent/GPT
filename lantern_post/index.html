let lines=[],duration=0,t=0,playing=false,started=0,base=0,current=-1, audio=new Audio();const $=id=>document.getElementById(id),title=$('title'),caption=$('caption'); audio.preload='auto';
function fmt(n){return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function seekTo(x){t=Math.max(0,Math.min(duration,x));base=t;started=performance.now();current=-1;audio.pause();render()}
function render(){if(playing)t=Math.min(duration,base+(performance.now()-started)/1000);let line=lines.findIndex(x=>t>=x.start&&t<x.start+x.duration);if(line!==current){audio.pause();current=line;if(line>=0&&playing){audio.src=lines[line].file;audio.currentTime=Math.max(0,t-lines[line].start);audio.play().catch(()=>{});}}caption.textContent=line<0?'':lines[line].text;title.style.opacity=t<3?1:0;$('seek').value=duration?Math.round(t/duration*1000):0;$('time').textContent=fmt(t)+' / '+fmt(duration);let s=Math.min(1,Math.max(0,(t-4)/duration));let box;if(line<0&&t<4) box=[0,0,1000,562];else if(line<2) box=[0,115,650,366];else if(line<7) box=[300,190,430,242];else if(line<10) box=[380,390,250,141];else if(line<14) box=[375,240,310,174];else if(line<17) box=[330,260,390,219];else box=[0,0,1000,562]; $('frame').setAttribute('viewBox',box.join(' '));$('people').setAttribute('transform',`translate(${Math.sin(t*.25)*1.5} 0)`);$('wash').setAttribute('transform',`translate(0 ${Math.sin(t*.45)*5-4})`);if(t>=duration&&playing){playing=false;audio.pause();$('play').textContent='▶ Replay'}requestAnimationFrame(render)}
$('play').onclick=()=>{if(!lines.length)return;if(playing){playing=false;audio.pause();$('play').textContent='▶ Play'}else{if(t>=duration)t=0;base=t;started=performance.now();playing=true;current=-1;$('play').textContent='❚❚ Pause'}};$('seek').oninput=e=>seekTo(+e.target.value/1000*duration);
fetch('manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{let x=4;lines=data.map(l=>{let a={...l,start:x};x+=l.duration+l.pause;return a});duration=x+4;$('status').innerHTML='<small>Written and illustrated for this episode · voices performed with Kokoro</small>';render()}).catch(()=>$('status').textContent='The voices are still being prepared. Please try again shortly.');
</script></body></html>
