<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Useless Button</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: rgba(255,255,255,.08);
      --text: #f5f7ff;
      --muted: #aab0c5;
      --accent: #8ea1ff;
      --accent-2: #ff9bd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(142,161,255,.24), transparent 34%),
        radial-gradient(circle at 80% 70%, rgba(255,155,213,.20), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .orb {
      position: fixed;
      width: 220px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(18px);
      opacity: .35;
      pointer-events: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      top: 8%;
      right: 10%;
      transition: transform .5s ease, filter .5s ease;
    }

    .card {
      width: min(92vw, 560px);
      padding: 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.09);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 70px);
      line-height: .95;
      letter-spacing: -.05em;
    }

    p {
      margin: 22px auto 30px;
      max-width: 38ch;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 15px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #111425;
      background: linear-gradient(135deg, #eef1ff, #ffc9e8);
      box-shadow: 0 10px 30px rgba(142,161,255,.2);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px) scale(.98); }

    .counter {
      margin-top: 22px;
      min-height: 28px;
      font-variant-numeric: tabular-nums;
      color: #dfe3f7;
    }

    .changed .orb {
      transform: translate(-34vw, 48vh) scale(1.35) rotate(90deg);
      filter: blur(4px) hue-rotate(75deg);
    }

    .changed .card {
      transform: rotate(.45deg);
    }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>

  <main class="card">
    <div class="badge">Productivity: 0%</div>
    <h1 id="headline">A Button.</h1>
    <p id="description">It does something. The something is useless. This is the entire product.</p>
    <button id="uselessButton" type="button">Do the useless thing</button>
    <div class="counter" id="counter">Useless actions completed: 0</div>
  </main>

  <script>
    const button = document.getElementById('uselessButton');
    const headline = document.getElementById('headline');
    const description = document.getElementById('description');
    const counter = document.getElementById('counter');

    let clicks = 0;

    const messages = [
      ['Still a Button.', 'Nothing useful happened, but the ambience has changed.'],
      ['Achievement?', 'You pressed it again. History will remain unaffected.'],
      ['Remarkable.', 'The page acknowledges your effort and offers no reward.'],
      ['We Continue.', 'At this point the button is mostly collecting statistics.']
    ];

    button.addEventListener('click', () => {
      clicks += 1;
      document.body.classList.toggle('changed');

      const [title, text] = messages[(clicks - 1) % messages.length];
      headline.textContent = title;
      description.textContent = text;
      counter.textContent = `Useless actions completed: ${clicks}`;
      button.textContent = clicks % 2 ? 'Undo absolutely nothing' : 'Do the useless thing';
    });
  </script>
</body>
</html>
