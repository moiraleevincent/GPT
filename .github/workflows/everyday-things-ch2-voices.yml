name: Generate Everyday Things chapter 2 voice samples
on:
  workflow_dispatch:
  push:
    paths:
      - "everyday_things_ch2_voices/generate.py"
      - ".github/workflows/everyday-things-ch2-voices.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install kokoro soundfile numpy
      - name: Render two texts in two voices
        run: python everyday_things_ch2_voices/generate.py
      - name: Publish MP3s and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add everyday_things_ch2_voices/audio/*.mp3 everyday_things_ch2_voices/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render chapter two voice examples [skip ci]"
          git pull --rebase origin main
          git push
