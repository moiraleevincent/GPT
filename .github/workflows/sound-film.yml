name: Generate sound film dialogue
on:
  workflow_dispatch:
  push:
    paths:
      - "sound_film/generate.py"
      - ".github/workflows/sound-film.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python sound_film/generate.py
      - name: Publish dialogue clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sound_film/*.wav sound_film/manifest.json
          git commit -m "Render sound film dialogue [skip ci]" || exit 0
          git pull --rebase origin main
          git push
