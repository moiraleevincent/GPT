name: Render Village After Hours 2026-10-09

on:
  workflow_dispatch:
  push:
    paths:
      - "village_after_hours_2026_10_09/generate.py"
      - ".github/workflows/village-after-hours-2026-10-09.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install kokoro soundfile numpy
      - name: Render audio
        run: python village_after_hours_2026_10_09/generate.py
      - name: Publish audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add village_after_hours_2026_10_09/village_after_hours_2026_10_09.mp3
          git commit -m "Render Village After Hours audio [skip ci]" || exit 0
          git push
