name: Analyze MakeHuman breast targets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/analyze-makehuman-targets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mesh-analysis dependencies
        run: python -m pip install --quiet numpy scipy trimesh
      - name: Compare MakeHuman firmness targets to the rigged GLB
        run: python torso_mesh_lab/tools/analyze_makehuman_transfer.py
      - name: Save diagnostic report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torso_mesh_lab/research/TARGET_TRANSFER_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Record MakeHuman firmness transfer feasibility"
            git push origin HEAD:main
          fi
