name: Render SECOND VOICE
on:
  workflow_dispatch:
  push:
    paths:
      - "second_voice/generate.py"
      - "second_voice/index.html"
      - ".github/workflows/second-voice.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install kokoro soundfile numpy pillow
      - run: python second_voice/generate.py
      - name: Publish film
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add second_voice/*.wav second_voice/manifest.json second_voice/second_voice.mp4
          git commit -m "Render SECOND VOICE [skip ci]" || exit 0
          git pull --rebase origin main
          git push
