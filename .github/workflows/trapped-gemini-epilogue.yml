name: Render Trapped Gemini epilogue audio
on:
  workflow_dispatch:
  push:
    paths:
      - "trapped_gemini/epilogue_audio/generate.py"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python trapped_gemini/epilogue_audio/generate.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trapped_gemini/epilogue_audio/*.wav trapped_gemini/epilogue_audio/manifest.json
          git commit -m "Render Trapped Gemini epilogue audio [skip ci]" || exit 0
          git pull --rebase origin main
          git push
