name: Make documentary auditions
on:
  workflow_dispatch:
  push:
    paths:
      - "voice_demo/audition.py"
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python voice_demo/audition.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_demo/audition_A.wav voice_demo/audition_B.wav voice_demo/audition_voice2.wav
          git commit -m "Add documentary voice auditions [skip ci]" || exit 0
          git push
