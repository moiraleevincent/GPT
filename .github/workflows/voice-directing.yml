name: Generate directed voice blends
on:
  workflow_dispatch:
  push:
    paths:
      - "voice_directing/generate.py"
      - ".github/workflows/voice-directing.yml"
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python voice_directing/generate.py
      - name: Publish directed voices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_directing/*.wav
          git commit -m "Render directed Kore Nova blends [skip ci]" || exit 0
          git pull --rebase origin main
          git push
