name: Render Evolutionary Court pilot

on:
  workflow_dispatch:
  push:
    paths:
      - "evolutionary_court/generate_pilot.py"
      - ".github/workflows/evolutionary-court.yml"

permissions:
  contents: write

concurrency:
  group: evolutionary-court
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install kokoro soundfile numpy
      - name: Render the original two-host pilot
        run: python evolutionary_court/generate_pilot.py
      - name: Commit playable MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evolutionary_court/pilot_kin_altruism.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Render Evolutionary Court audio [skip ci]"
          git push
