name: Render The Ninth Room (Kokoro film)
on:
  workflow_dispatch:
  push:
    paths:
      - "the_ninth_room/script.json"
      - "the_ninth_room/generate.py"
      - ".github/workflows/the-ninth-room.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install speech and sound dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          pip install kokoro soundfile numpy
      - name: Render character dialogue, score, timeline and stereo master
        run: python the_ninth_room/generate.py
      - name: Publish finished film audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the_ninth_room/audio/*.wav the_ninth_room/soundtrack.mp3 the_ninth_room/timeline.json the_ninth_room/manifest.json
          git commit -m "Render The Ninth Room Kokoro soundtrack [skip ci]" || exit 0
          git pull --rebase origin main
          git push
