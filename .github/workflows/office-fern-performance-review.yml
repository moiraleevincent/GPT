name: Render Fern's Performance Review

on:
  workflow_dispatch:
  push:
    paths:
      - "office_fern_performance_review/render.py"
      - ".github/workflows/office-fern-performance-review.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install film and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy pillow soundfile kokoro
      - name: Render original film
        run: python office_fern_performance_review/render.py
      - name: Publish MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add office_fern_performance_review/fern_performance_review.mp4
          git commit -m "Render original Fern mockumentary [skip ci]" || exit 0
          git push
