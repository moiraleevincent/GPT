name: Render Trapped Gemini V6
on:
  workflow_dispatch:
  push:
    paths:
      - "trapped_gemini/render_epilogue_v6.py"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow numpy soundfile
      - run: python trapped_gemini/render_epilogue_v6.py
      - name: Concatenate V5 and epilogue
        run: |
          printf "file 'trapped_gemini_v5_animatic.mp4'\nfile 'epilogue_v6.mp4'\n" > trapped_gemini/v6_concat.txt
          cd trapped_gemini
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 -i v6_concat.txt -c copy trapped_gemini_v6_animatic.mp4
      - name: Publish V6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trapped_gemini/epilogue_v6.mp4 trapped_gemini/epilogue_mix_v6.wav trapped_gemini/trapped_gemini_v6_animatic.mp4
          git commit -m "Render Trapped Gemini V6 with rescue epilogue [skip ci]" || exit 0
          git pull --rebase origin main
          git push || {
            sleep 3
            git pull --rebase origin main
            git push
          }
