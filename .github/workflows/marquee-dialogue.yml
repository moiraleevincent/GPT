name: Marquee Film — Kokoro Dialogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "marquee_film/generate_dialogue.py"
      - ".github/workflows/marquee-dialogue.yml"

permissions:
  contents: write

concurrency:
  group: marquee-dialogue
  cancel-in-progress: false

jobs:
  render-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          pip install kokoro soundfile numpy
      - name: Render dialogue aligned to the film timeline
        run: python marquee_film/generate_dialogue.py
      - name: Commit finished audio and timing manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marquee_film/audio/dialogue.mp3 marquee_film/audio/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Render Marquee opening dialogue soundtrack"
            git pull --rebase
            git push
          fi
