name: Render House Rules Kokoro rap

on:
  workflow_dispatch:
  push:
    paths:
      - "house_rules/generate.py"
      - ".github/workflows/house-rules-kokoro.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install kokoro soundfile numpy
      - name: Render and mix rap
        run: python house_rules/generate.py
      - name: Check MP3 exists
        run: test -s house_rules/house_rules.mp3
      - name: Publish generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add house_rules/house_rules.mp3
          if git diff --cached --quiet; then
            echo "No changes in rendered audio"
          else
            git commit -m "Render House Rules with Kokoro [skip ci]"
            git pull --rebase origin main
            git push
          fi
