name: Generate Work Companion Radio direction test

on:
  workflow_dispatch:
  push:
    paths:
      - "work_companion_radio/directing_experiment/generate.py"
      - ".github/workflows/work-companion-directing.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install kokoro soundfile numpy librosa
      - name: Render direction tests
        run: python work_companion_radio/directing_experiment/generate.py
      - name: Publish MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work_companion_radio/directing_experiment/*.mp3
          git commit -m "Render Work Companion Radio direction tests [skip ci]" || exit 0
          git push
