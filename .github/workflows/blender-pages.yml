name: Publish Blender Lab viewer to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Character Lab — render Star Keeper", "3D Tool Audition — Blender creature", "3D Hybrid Audition — Export Blender GLB"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "3d_tool_audition/**"
      - "blender_lab/index.html"
      - "blender_lab/output/first_motion.mp4"
      - "blender_lab/output/poster.png"
      - "character_lab/index.html"
      - "face_expression_lab/index.html"
      - "wave_avatar_lab/index.html"
      - "body_study_01/index.html"
      - "body_study_01/figure.svg"
      - "body_study_02/index.html"
      - "body_study_02/figure.svg"
      - "torso_landmark_lab/index.html"
      - "body_leg_lab/index.html"
      - "body_arm_lab/index.html"
      - "stillwater/**"
      - "moongarden/**"
      - "rose-below/**"
      - "stillwater-blue/**"
      - "character_lab/output/star_keeper.mp4"
      - "character_lab/output/poster.png"
      - ".github/workflows/blender-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Assemble the Blender viewer site
        run: |
          mkdir -p site/3d_tool_audition/hybrid/output
          cp 3d_tool_audition/hybrid/index.html site/3d_tool_audition/hybrid/index.html
          if [ -f 3d_tool_audition/hybrid/output/hybrid_creature.glb ]; then cp 3d_tool_audition/hybrid/output/hybrid_creature.glb site/3d_tool_audition/hybrid/output/; fi
          mkdir -p site/3d_tool_audition/babylon
          cp 3d_tool_audition/babylon/index.html site/3d_tool_audition/babylon/index.html
          mkdir -p site/3d_tool_audition/three
          cp 3d_tool_audition/three/index.html site/3d_tool_audition/three/index.html
          mkdir -p site/3d_tool_audition/output
          cp 3d_tool_audition/index.html site/3d_tool_audition/index.html
          if [ -f 3d_tool_audition/output/creature.mp4 ]; then cp 3d_tool_audition/output/creature.mp4 site/3d_tool_audition/output/; fi
          if [ -f 3d_tool_audition/output/poster.png ]; then cp 3d_tool_audition/output/poster.png site/3d_tool_audition/output/; fi
          mkdir -p site/blender_lab/output
          cp blender_lab/index.html site/blender_lab/index.html
          cp blender_lab/output/first_motion.mp4 site/blender_lab/output/
          cp blender_lab/output/poster.png site/blender_lab/output/
          mkdir -p site/character_lab/output
          cp character_lab/index.html site/character_lab/index.html
          if [ -f character_lab/output/star_keeper.mp4 ]; then cp character_lab/output/star_keeper.mp4 site/character_lab/output/; fi
          if [ -f character_lab/output/poster.png ]; then cp character_lab/output/poster.png site/character_lab/output/; fi
          mkdir -p site/face_expression_lab
          cp face_expression_lab/index.html site/face_expression_lab/index.html
          mkdir -p site/wave_avatar_lab
          cp wave_avatar_lab/index.html site/wave_avatar_lab/index.html
          mkdir -p site/body_study_01
          cp body_study_01/index.html site/body_study_01/index.html
          cp body_study_01/figure.svg site/body_study_01/figure.svg
          mkdir -p site/body_study_02
          cp body_study_02/index.html site/body_study_02/index.html
          cp body_study_02/figure.svg site/body_study_02/figure.svg
          mkdir -p site/torso_landmark_lab
          cp torso_landmark_lab/index.html site/torso_landmark_lab/index.html
          mkdir -p site/body_leg_lab
          cp body_leg_lab/index.html site/body_leg_lab/index.html
          mkdir -p site/body_arm_lab
          cp body_arm_lab/index.html site/body_arm_lab/index.html
          # Publish the original aquariums alongside the A4 blue-light experiment.
          for aquarium in stillwater moongarden rose-below stillwater-blue; do
            if [ -d "$aquarium" ]; then cp -R "$aquarium" "site/$aquarium"; fi
          done
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=blender_lab/"><title>Blender Lab</title></head><body><p><a href="blender_lab/">Open Blender Lab</a></p></body></html>' > site/index.html
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
