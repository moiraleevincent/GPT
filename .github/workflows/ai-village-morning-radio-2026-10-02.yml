name: Render AI Village Morning Radio 2026-10-02

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_village_morning_radio_2026_10_02/generate.py"
      - ".github/workflows/ai-village-morning-radio-2026-10-02.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install kokoro soundfile numpy
      - name: Render episode
        run: python ai_village_morning_radio_2026_10_02/generate.py
      - name: Publish episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_village_morning_radio_2026_10_02/ai_village_morning_radio_2026_10_02.mp3
          git commit -m "Render AI Village morning radio [skip ci]" || exit 0
          git push
