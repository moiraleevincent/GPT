name: Marquee Film — Visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "marquee_film/qa_frames.py"
      - ".github/workflows/marquee-qa.yml"

permissions:
  contents: write

concurrency:
  group: marquee-qa
  cancel-in-progress: false

jobs:
  film-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Render and inspect key shots
        run: python marquee_film/qa_frames.py
      - name: Commit visual review images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marquee_film/qa/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Save Marquee animatic screenshot QA [skip ci]"
            git pull --rebase
            git push
          fi
