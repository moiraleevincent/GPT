name: Generate The Room
on:
  workflow_dispatch:
  push:
    paths:
      - "audio_room/generate.py"
      - ".github/workflows/audio-room.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python audio_room/generate.py
      - name: Publish audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio_room/the_room.wav
          git commit -m "Render The Room audio piece [skip ci]" || exit 0
          git pull --rebase origin main
          git push

# trigger
