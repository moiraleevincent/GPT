name: Screen The Salt Orchard
on:
  workflow_dispatch:
  push:
    paths: ['salt_orchard/paint.py', 'salt_orchard/render.py', '.github/workflows/salt-orchard-picture.yml']
permissions:
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg inkscape fonts-dejavu-core
      - run: pip install pillow numpy
      - run: python salt_orchard/paint.py && python salt_orchard/render.py
      - run: |
          ffprobe -v error -show_entries format=duration salt_orchard/the-salt-orchard.mp4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add salt_orchard/the-salt-orchard.mp4
          git commit -m 'Publish The Salt Orchard [skip ci]'
          git pull --rebase origin main
          git push
