name: Generate voice sample

on:
  workflow_dispatch:
  push:
    paths:
      - "voice_demo/**"
      - ".github/workflows/voice-demo.yml"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kokoro soundfile numpy
      - run: python voice_demo/generate.py
      - name: Publish voice samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_demo/*.wav
          git commit -m "Update generated voice samples [skip ci]" || exit 0
          git push
