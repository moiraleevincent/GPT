name: Generate Work Companion Radio

on:
  workflow_dispatch:
  push:
    paths:
      - "work_companion_radio/generate.py"
      - ".github/workflows/work-companion-radio.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio tools and Kokoro
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install kokoro soundfile numpy
      - name: Render episode
        run: python work_companion_radio/generate.py
      - name: Publish MP3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f work_companion_radio/episode1_attachment_review.wav
          git add work_companion_radio/episode1_attachment_review.mp3
          git commit -m "Render Work Companion Radio episode 1 [skip ci]" || exit 0
          git push
