name: Render Mara Kokoro revoice
on:
  workflow_dispatch:
  push:
    paths:
      - "mara_kokoro_revoice/generate.py"
      - ".github/workflows/mara-kokoro-revoice.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install kokoro soundfile numpy
      - name: Render Kokoro voices
        run: python mara_kokoro_revoice/generate.py
      - name: Publish reusable audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mara_kokoro_revoice/*.wav mara_kokoro_revoice/*.mp3 mara_kokoro_revoice/manifest.json
          git commit -m "Render Mara Kokoro dialogue [skip ci]" || exit 0
          git push
